<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>BrickByBrick</title>

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="apple-mobile-web-app-title" content="BrickByBrick" />
    <meta name="application-name" content="BrickByBrick" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#F7FFFC" />
    <style>
      html,
      body {
        margin: 0;
        background: #f7fffc;
      }
      /* Painted with the document so the mark is on screen before the bundle runs.
         Keyframes live only here; the app stylesheet must not redeclare them. */
      #gt-launch {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(120% 85% at 50% -18%, rgba(46, 196, 182, 0.1) 0%, transparent 52%),
          radial-gradient(95% 70% at 100% 92%, rgba(46, 196, 182, 0.06) 0%, transparent 48%),
          radial-gradient(ellipse 140% 100% at 50% 50%, #f2fbf7 0%, #f7fffc 52%, #eef8f4 100%);
        gap: 20px;
        font-family: "DM Sans", "Avenir Next", "Segoe UI", sans-serif;
      }
      #gt-launch .gt-splash-logo {
        animation: gt-launch-in 2s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #gt-launch .gt-splash-logo img {
        width: 120px;
        height: 120px;
        border-radius: 28px;
        display: block;
        object-fit: cover;
        background: #ffffff;
        box-shadow: 0 0 40px rgba(46, 196, 182, 0.16);
      }
      #gt-launch .gt-splash-text {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        color: #14756c;
        animation: gt-launch-in 2s 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #gt-launch.gt-splash-out {
        animation: gt-launch-out 2.8s 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        pointer-events: none;
      }
      @keyframes gt-launch-in {
        from {
          opacity: 0;
          transform: scale(0.82);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes gt-launch-out {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(1.06);
        }
      }
    </style>
  </head>
  <body>
    <div id="gt-launch" role="status" aria-label="BrickByBrick">
      <div class="gt-splash-logo">
        <img src="/icon-512.png" alt="" width="120" height="120" />
      </div>
      <div class="gt-splash-text">BrickByBrick</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
